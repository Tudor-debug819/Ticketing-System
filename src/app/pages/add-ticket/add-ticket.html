<div class="max-w-2xl mx-auto p-4">
    <h2 class="text-2xl font-semibold mb-4 text-slate-100">Create Ticket</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Title</mat-label>
            <input matInput formControlName="title" placeholder="E.g. Telefon nu se încarcă" />
            <mat-error *ngIf="form.controls.title.touched && form.controls.title.errors">
                Title is required (min 4 chars)
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Description</mat-label>
            <textarea matInput rows="5" formControlName="description"
                placeholder="Descrie problema, când a apărut, ce ai încercat..."></textarea>
            <mat-error *ngIf="form.controls.description.touched && form.controls.description.errors">
                Description is required (min 10 chars)
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Priority</mat-label>
            <mat-select formControlName="priority">
                <mat-option value="low">Low</mat-option>
                <mat-option value="medium">Medium</mat-option>
                <mat-option value="high">High</mat-option>
                <mat-option value="urgent">Urgent</mat-option>
            </mat-select>
        </mat-form-field>

        <div class="flex items-center gap-3">
            <button mat-raised-button color="primary" type="submit" [disabled]="loading">
                {{ loading ? 'Saving…' : 'Create Ticket' }}
            </button>
            <a mat-stroked-button [routerLink]="['/my-tickets']">Cancel</a>
        </div>
    </form>
</div>
