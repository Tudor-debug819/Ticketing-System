<!-- FILTRE -->
<div class="mb-4 flex flex-col md:flex-row gap-3 items-start md:items-center">
    <h2 class="text-xl font-semibold text-white">All tickets</h2>
    <div class="flex-1"></div>

    <input [(ngModel)]="search" type="text" placeholder="Search id / title / customer"
        class="px-3 py-2 rounded-xl bg-slate-800 text-white placeholder-white/60 border border-slate-700 w-full md:w-72">

    <select [(ngModel)]="statusFilter" class="px-3 py-2 rounded-xl bg-slate-800 text-white border border-slate-700">
        <option value="All">All statuses</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Resolved">Resolved</option>
        <option value="Closed">Closed</option>
    </select>
</div>

<!-- TABEL -->
<div class="rounded-2xl overflow-hidden shadow bg-slate-900 text-white">
    <table class="w-full">
        <thead class="bg-slate-800 text-white/80">
            <tr>
                <th class="text-left px-4 py-3">ID</th>
                <th class="text-left px-4 py-3">Title</th>
                <th class="text-left px-4 py-3">Customer</th>
                <th class="text-left px-4 py-3">Created</th>
                <th class="text-left px-4 py-3">Status</th>
                <th class="text-left px-4 py-3">Assigned</th>
                <th class="text-right px-4 py-3">Actions</th>
            </tr>
        </thead>

        <tbody class="divide-y divide-slate-800">
            <tr *ngFor="let t of filtered; trackBy: trackById" class="hover:bg-slate-800/60">
                <td class="px-4 py-3">#{{ t.id }}</td>
                <td class="px-4 py-3">{{ t.title }}</td>
                <td class="px-4 py-3">{{ t.customer }}</td>
                <td class="px-4 py-3 text-white/70">{{ t.createdAt }}</td>
                <td class="px-4 py-3">
                    <span class="px-2 py-1 text-xs rounded-full font-medium" [ngClass]="badgeClass(t.status)">
                        {{ t.status }}
                    </span>
                </td>
                <td class="px-4 py-3">
                    <span *ngIf="t.assignedTo === null" class="text-white/60">—</span>
                    <span *ngIf="t.assignedTo !== null" class="inline-flex items-center gap-1">
                        <mat-icon class="text-white/80">person</mat-icon>
                        Tech #{{ t.assignedTo }}
                    </span>
                </td>
                <td class="px-4 py-3 text-right">
                    <button *ngIf="t.assignedTo === null" (click)="assignToMe(t)"
                        class="px-3 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white">
                        Assign to me
                    </button>
                    <a [routerLink]="['/technician/tickets', t.id]"
                        class="ml-2 px-3 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-white inline-block">
                        View
                    </a>
                </td>
            </tr>

            <tr *ngIf="filtered.length === 0">
                <td colspan="7" class="px-4 py-6 text-center text-white/70">No tickets match your filters.</td>
            </tr>
        </tbody>
    </table>
</div>
